[project]
name = "unihub"
version = "0.1.0"
description = "Local study corpus and read-only MCP server for USyd Canvas and Ed Discussion"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "tzdata>=2024.1",
]

[project.scripts]
uni-hub = "unihub.cli:main"
uni-hub-mcp = "unihub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unihub"]
